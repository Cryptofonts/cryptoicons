name: Build and release packages

on:
  push:
    branches:
      - master
    paths:
      - assets/**
      - packages/**
      - scripts/**
      - .changeset/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install npm CLI with trusted publishing support
        # npm 12 rejects the --no-git-checks flag forwarded by pnpm 10.
        run: npm install --global npm@11.19.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm build
      - name: Create asset update changeset
        if: github.event_name == 'push'
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- assets/ | grep -q .; then
            mkdir -p .changeset
            cat > ".changeset/assets-${GITHUB_RUN_ID}.md" <<'EOF'
          ---
          '@cryptofonts/core': patch
          '@cryptofonts/react': patch
          ---

          Regenerate icon metadata and React components.
          EOF
          fi
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
